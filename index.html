<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101622">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <title>PWA Test Laboratuvarı</title>
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <main>
    <header><span class="brand"><img src="/icon-192.png" width="32" height="32" alt=""> PWA Test Laboratuvarı</span><button id="install" class="secondary" hidden>Ana ekrana ekle</button></header>
    <section id="meeting" class="panel">
      <div class="section-heading"><h1>Bire bir görüşme</h1><span id="call-network" class="badge" hidden></span></div>
      <div class="stage">
        <video id="remote" playsinline autoplay></video>
        <p id="stage-message">Karşı taraf bağlandığında görüntüsü burada açılır.</p>
        <video id="local" playsinline autoplay muted hidden aria-label="Kendi görüntün"></video>
      </div>
      <div class="controls">
        <button id="start-call" class="primary">Oda oluştur</button>
        <button id="new-room" class="secondary" hidden>Yeni oda oluştur</button>
        <button id="mic" class="secondary" aria-pressed="false" hidden>Mikrofonu kapat</button>
        <button id="camera" class="secondary" hidden>Kamera değiştir</button>
        <button id="resume-video" class="secondary" hidden>Sesi ve görüntüyü oynat</button>
        <button id="end-call" class="danger" hidden>Görüşmeyi bitir</button>
      </div>
      <p id="call-status" class="status" role="status"></p>
      <p id="playback-status" class="status" role="status"></p>
      <p id="call-diagnostics" class="status" hidden></p>
      <div id="invite" class="invite" hidden>
        <img id="invite-qr" alt="Görüşmeye katılma QR kodu" width="144" height="144">
        <div><label for="room-url">Davet bağlantısı</label><input id="room-url" readonly>
          <div class="controls"><button id="copy" class="secondary">Bağlantıyı kopyala</button><button id="share" class="secondary" hidden>Paylaş</button></div>
        </div>
      </div>
    </section>
    <div class="grid">
      <section class="panel">
        <h2>Toplantı ses kaydı</h2>
        <p id="recording-notice" class="status" role="status">Kayıt için iki katılımcının onayı gerekir.</p>
        <div class="controls">
          <button id="record-meeting" class="primary" disabled>Toplantı ses kaydı al</button>
          <button id="allow-recording" class="primary" hidden>Kayda izin ver</button>
          <button id="decline-recording" class="secondary" hidden>İzin verme</button>
          <button id="stop-recording" class="danger" hidden>Kaydı durdur</button>
        </div>
        <div id="recording-result" class="output" hidden>
          <audio id="meeting-audio" controls preload="metadata" hidden></audio>
          <div class="controls"><button id="play-recording" class="secondary">Oynat</button><button id="share-recording" class="secondary">Paylaş</button></div>
          <p id="recording-result-status" class="status" role="status"></p>
        </div>
      </section>
      <section class="panel">
        <div class="section-heading"><h2>QR ve barkod</h2><span id="scan-support" class="badge"></span></div>
        <video id="scan-preview" class="preview" autoplay playsinline muted hidden aria-label="Tarayıcı kamera önizleme"></video>
        <div class="controls"><button id="scan" class="primary">Kamerayla okut</button><button id="scan-stop" class="danger" hidden>Taramayı durdur</button></div>
        <label for="scan-file" class="file-label">Görselden okut</label>
        <input id="scan-file" type="file" accept="image/*">
        <p id="scan-status" class="status" role="status"></p>
        <a id="scan-room" class="secondary" hidden>Bu görüşme odasına git</a>
      </section>
    </div>
    <footer>Toplantı kaydı, kaydı başlatan kişinin tarayıcısında hazırlanır.</footer>
  </main>
</body>
</html>
